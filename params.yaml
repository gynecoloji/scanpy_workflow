# params.yaml — runtime configuration for scanpy_workflow Nextflow pipeline
# Override defaults in nextflow.config. Pass with: nextflow run ... -params-file params.yaml

input_dir: "data/cellranger/"
output_dir: "results/"
samples:
  - sample_A
  - sample_B

# Path to a directory containing pre-built Singularity/Apptainer .sif files.
# Expected filenames: scanpy.sif, scvi.sif, r_env.sif
# Uncomment and set when using -profile singularity or -profile apptainer.
# If null (default), containers are pulled from Docker Hub at runtime.
sif_dir: null

ambient:
  enabled: true
  method: soupx           # soupx | decontx

filter:
  min_genes: 200
  max_genes: 6000
  min_counts: 500
  max_counts: 30000
  max_pct_mito: 20
  max_pct_ribo: 50
  min_cells: 3

doublet:
  enabled: true
  method: scrublet

normalization:
  method: library_size    # library_size | scran
  target_sum: 10000

hvg:
  n_top_genes: 3000
  post_merge_n_top_genes: 2000
  flavor: seurat_v3       # seurat_v3 | seurat | cell_ranger

pca:
  n_comps: 50
  evaluate: true           # scree plot, loadings, pca_metrics.json

batch_correction:
  enabled: true
  evaluate: true           # UMAP post-correction, batch metrics JSON
  method: harmony         # harmony | scvi | bbknn
  batch_key: sample

imputation:
  enabled: false
  method: magic           # magic | scvi | alra
  evaluate: true

clustering:
  algorithm: leiden       # leiden | louvain
  resolution: 0.5
  n_neighbors: 15
  evaluate: true

annotation:
  unsupervised: true
  automated: true
  method: celltypist      # celltypist | sctype
  celltypist_model: "Immune_All_Low.pkl"
  sctype_markers: null    # path to markers.json; required if method: sctype

pathway:
  enabled: false
  source: msigdb_hallmark  # msigdb_hallmark | msigdb_kegg | msigdb_reactome | msigdb_gobp | progeny | custom
  method: aucell           # aucell | ulm | scanpy_score
  groupby: leiden          # obs column for per-cluster summary
  organism: human          # human | mouse
  min_n: 5                 # min gene-set/data overlap to keep a gene set
  custom_genesets: null    # path to .gmt or .csv file (required when source: custom)

de:
  method: wilcoxon        # wilcoxon | t-test | logreg | mast | pseudobulk
  groupby: leiden
  sample_key: sample      # obs column with sample IDs (used by pseudobulk)
  min_cells: 10           # min cells per (cluster, sample) pseudo-bulk (used by pseudobulk)

output_dir: "results/"
report: true
