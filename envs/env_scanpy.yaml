# envs/env_scanpy.yaml
name: env_scanpy
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - scanpy>=1.9
  - anndata>=0.9
  - harmonypy>=0.0.9
  - bbknn>=1.6
  - magic-impute>=3.0
  - scrublet>=0.2
  - celltypist>=1.5
  - scib-metrics>=0.4
  - leidenalg>=0.10
  - louvain>=0.8
  - python-igraph>=0.11
  - scikit-learn>=1.3
  - click>=8.0
  - pyyaml>=6.0
  - jinja2>=3.0
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12
  - decoupler-py>=1.6      # pathway / gene-set scoring (aucell, ulm, MSigDB, PROGENy)
  - pip
  - pip:
    - scanpy_workflow  # install local package (editable install handled by CI)
