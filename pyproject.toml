[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanpy-workflow"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "scanpy>=1.9",
    "anndata>=0.9",
    "harmonypy>=0.0.9",
    "bbknn>=1.6",
    "magic-impute>=3.0",
    "scrublet>=0.2",
    "celltypist>=1.5",
    "scib-metrics>=0.4",
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "leidenalg>=0.10",
    "louvain>=0.8",
    "python-igraph>=0.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
pathway = ["decoupler-py>=1.6"]
scvi = ["scvi-tools>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
scanpy-workflow = "scanpy_workflow.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/scanpy_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
